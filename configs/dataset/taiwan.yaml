name: taiwan
raw_path: data/Taiwan/Taiwan.csv
read_kwargs:
  header: 1                 # the file carries a two-row header (X1..X23, then real names)
  index_col: 0
target: default payment next month
positive_label: 1
drop_columns: []
numeric:
  - LIMIT_BAL
  - AGE
  - PAY_0
  - PAY_2
  - PAY_3
  - PAY_4
  - PAY_5
  - PAY_6
  - BILL_AMT1
  - BILL_AMT2
  - BILL_AMT3
  - BILL_AMT4
  - BILL_AMT5
  - BILL_AMT6
  - PAY_AMT1
  - PAY_AMT2
  - PAY_AMT3
  - PAY_AMT4
  - PAY_AMT5
  - PAY_AMT6
categorical:
  - SEX
  - EDUCATION
  - MARRIAGE
recode:
  EDUCATION: { 0: 4, 5: 4, 6: 4 }
  MARRIAGE: { 0: 3 }
