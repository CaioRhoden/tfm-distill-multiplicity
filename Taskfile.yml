version: '3'

# Every stage of the experiment runs through this file.

env:
  PYTHONHASHSEED: '0'

vars:
  RUN: uv run tfmdm
  DATASETS: adult taiwan
  MODELS: ebm nam
  ARMS: hard distilled
  # Split replicates. Override per invocation: SPLIT_SEEDS='0 1' task data
  SPLIT_SEEDS: '{{.SPLIT_SEEDS | default "0"}}'
  # Run seeds per SLURM job. Empty = all 30 in one job; set e.g. 10 for more parallelism.
  CHUNK: '{{.CHUNK | default ""}}'

tasks:
  default:
    cmds: [task --list]

  # --- environment -------------------------------------------------------------
  setup:
    desc: Create the virtualenv from the lockfile (no resolution, fully reproducible)
    cmds:
      - uv sync --locked --all-groups
      - '{{.RUN}} --help > /dev/null'

  lock:
    desc: Re-resolve dependencies and refresh uv.lock; commit the result
    cmds:
      - uv lock --upgrade
      - uv sync --all-groups

  setup:tabicl:
    desc: Install the TabICLv2 extra (pin the distribution name in pyproject.toml first)
    cmds: [uv sync --locked --all-groups --extra tabicl]

  test:
    desc: Unit tests (metric identities, preprocessing correctness, cross-fitting guards)
    cmds: [uv run pytest -q]

  fmt:
    cmds: [uv run ruff format src tests, uv run ruff check --fix src tests]

  lint:
    cmds: [uv run ruff check src tests]

  # --- phase 1 -----------------------------------------------------------------
  data:
    desc: 'Phase 1: clean, split 60/20/20 and build the views, for every split replicate'
    cmds:
      - |
        for k in {{.SPLIT_SEEDS}}; do for d in {{.DATASETS}}; do
          {{.RUN}} data --dataset $d --split-seed $k
        done; done

  # --- phase 2 -----------------------------------------------------------------
  tabicl:probe:
    desc: 'Phase 2.1: TabICLv2 feasibility probe on 5% of the data (primary split only)'
    cmds:
      - for: { var: DATASETS, split: ' ' }
        cmd: '{{.RUN}} probe --dataset {{.ITEM}}'

  tabicl:softlabels:
    desc: 'Phase 2.2-2.3: cross-fitted TabICLv2 probabilities, per split replicate'
    deps: [data]
    cmds:
      - |
        for k in {{.SPLIT_SEEDS}}; do for d in {{.DATASETS}}; do
          {{.RUN}} softlabels --dataset $d --split-seed $k
        done; done

  tabicl:preds:
    desc: 'Phase 2.4 / R1: the 30-model TabICLv2 set (baseline B3), per split replicate'
    deps: [data]
    cmds:
      - |
        for k in {{.SPLIT_SEEDS}}; do for d in {{.DATASETS}}; do
          for s in $(seq 0 29); do
            {{.RUN}} tabicl-preds --dataset $d --seed $s --split-seed $k
          done
        done; done

  # --- phase 3 -----------------------------------------------------------------
  sanity:
    desc: 'degenerate and reproduction gates. The sweep waits on this.'
    deps: [data]
    cmds: ['{{.RUN}} sanity --datasets {{.DATASETS}} --models {{.MODELS}}']

  # --- phase 4 -----------------------------------------------------------------
  tune:
    desc: 'one random search per (dataset, model, arm), shared by all 30 seeds'
    cmds:
      - |
        for k in {{.SPLIT_SEEDS}}; do for d in {{.DATASETS}}; do for m in {{.MODELS}}; do
          for a in {{.ARMS}}; do
            {{.RUN}} tune --dataset $d --model $m --arm $a --split-seed $k
          done
        done; done; done

  train:
    desc: 'One cell. Usage: task train -- --dataset adult --model ebm --arm hard --seed 0'
    cmds: ['{{.RUN}} train {{.CLI_ARGS}}']

  train:group:
    desc: 'All run seeds of one group. Usage: task train:group -- --dataset adult --model ebm --arm hard'
    cmds: ['{{.RUN}} train-group {{.CLI_ARGS}}']

  sweep:
    desc: 'Phase 4.1 locally: every group in sequence. Prefer task slurm on a cluster.'
    cmds:
      - |
        {{.RUN}} sweep --datasets {{.DATASETS}} --models {{.MODELS}} --arms {{.ARMS}} \
          --split-seeds {{.SPLIT_SEEDS}} {{if .CHUNK}}--chunk {{.CHUNK}}{{end}}

  groups:
    desc: Print the SLURM group grid, one JSON object per line
    cmds:
      - |
        {{.RUN}} groups --datasets {{.DATASETS}} --models {{.MODELS}} --arms {{.ARMS}} \
          --split-seeds {{.SPLIT_SEEDS}} {{if .CHUNK}}--chunk {{.CHUNK}}{{end}}

  slurm:
    desc: Submit the sweep as a SLURM array, one job per group (idempotent)
    cmds:
      - |
        export TFMDM_DATASETS='{{.DATASETS}}' TFMDM_MODELS='{{.MODELS}}'
        export TFMDM_ARMS='{{.ARMS}}' TFMDM_SPLIT_SEEDS='{{.SPLIT_SEEDS}}'
        export TFMDM_CHUNK='{{.CHUNK}}'
        N=$(task groups | wc -l)
        echo "Submitting $N groups (each covering its own run seeds)"
        sbatch --array=0-$((N-1))%16 \
          --export=ALL,TFMDM_DATASETS,TFMDM_MODELS,TFMDM_ARMS,TFMDM_SPLIT_SEEDS,TFMDM_CHUNK \
          scripts/sweep.slurm

  tune:slurm:
    desc: Submit the tuning sweep as a SLURM array, one job per (dataset, model, arm, split)
    cmds:
      - |
        export TFMDM_DATASETS='{{.DATASETS}}' TFMDM_MODELS='{{.MODELS}}'
        export TFMDM_ARMS='{{.ARMS}}' TFMDM_SPLIT_SEEDS='{{.SPLIT_SEEDS}}'
        N=$(( $(wc -w <<<"$TFMDM_DATASETS") * $(wc -w <<<"$TFMDM_MODELS") \
              * $(wc -w <<<"$TFMDM_ARMS") * $(wc -w <<<"$TFMDM_SPLIT_SEEDS") ))
        echo "Submitting $N tuning cells"
        sbatch --array=0-$((N-1))%4 \
          --export=ALL,TFMDM_DATASETS,TFMDM_MODELS,TFMDM_ARMS,TFMDM_SPLIT_SEEDS \
          slurm/tune_sweep.sh

  # --- phase 5 -----------------------------------------------------------------
  analyze:
    desc: 'Phase 5.1-5.3: multiplicity, intervals and Holm-corrected tests, per split'
    cmds:
      - |
        for k in {{.SPLIT_SEEDS}}; do
          {{.RUN}} analyze --datasets {{.DATASETS}} --split-seed $k
        done

  combine:
    desc: 'Pool the per-split results into results/across_splits.csv (robustness readout)'
    cmds: ['{{.RUN}} combine --split-seeds {{.SPLIT_SEEDS}}']

  figures:
    desc: Render F1-F4 into results/split{K}/figures/, for every split replicate
    cmds:
      - |
        for k in {{.SPLIT_SEEDS}}; do
          {{.RUN}} figures --datasets {{.DATASETS}} --models {{.MODELS}} --split-seed $k
        done

  all:
    desc: The full pipeline in order. Stops at the first failing gate.
    cmds:
      - task: data
      - task: sanity
      - task: tabicl:softlabels
      - task: tabicl:preds
      - task: tune
      - task: sweep
      - task: analyze
      - task: combine
      - task: figures

  # --- housekeeping ------------------------------------------------------------
  clean:
    desc: Remove derived data, predictions and results. Raw data is never touched.
    cmds:
      - rm -rf data/interim data/processed artifacts results
      - echo "Removed derived artifacts. Raw CSVs under data/ are untouched."

  clean:split:
    desc: 'Drop one replicate. Usage: SPLIT=2 task clean:split'
    cmds:
      - rm -rf artifacts/split{{.SPLIT}} results/split{{.SPLIT}} configs/tuned/split{{.SPLIT}}
      - echo "Removed split {{.SPLIT}}." 
